# ── Database ──────────────────────────────────────────────────────────────────
# Set DATABASE_URL (full JDBC URL) or the individual DB_* vars in your environment.
# Never commit real credentials to git.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ucl_stats}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; tune if needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' in production — schema is managed by the db_seeder / Flyway
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable unaccent extension support for diacritic-insensitive search
# Requires: CREATE EXTENSION IF NOT EXISTS unaccent; on your PostgreSQL instance
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
